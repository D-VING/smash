<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SMASH WORLD — 부숴!</title>
<style>
:root{color-scheme:dark;--bg:#090e17;--panel:#111b2a;--line:#29384d;--muted:#91a3b9;--accent:#ff713d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf4ff;font:14px/1.45 system-ui,'Malgun Gothic',sans-serif;overflow:hidden}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:12px}.brand,.stats,.panel,.switcher{background:#0d1725df;border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 35px #0006;backdrop-filter:blur(12px)}.brand{padding:12px 16px}.brand small{color:#9fb0c5;letter-spacing:.16em;font-weight:800}.brand h1{margin:2px 0 0;font-size:clamp(20px,3vw,30px);letter-spacing:-.04em}.stats{padding:10px 14px;text-align:right;min-width:130px}.stats b{font-size:22px;color:#ffd16b}.stats span{display:block;color:var(--muted);font-size:11px}.switcher{position:fixed;top:112px;left:14px;padding:6px;display:flex;gap:6px}.btn{border:1px solid #35465d;background:#1a293d;color:#eaf2ff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer;transition:.16s}.btn:hover{transform:translateY(-2px);border-color:#ff8a55}.btn.active{background:#873b27;border-color:#ff8758;color:white}.panel{position:fixed;left:14px;bottom:14px;width:min(370px,calc(100vw - 28px));padding:12px}.panel h3{margin:0 0 8px;color:#aebed1;font-size:11px;letter-spacing:.13em}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tool{min-height:68px;display:grid;place-items:center;gap:1px;padding:7px 4px}.tool i{font-style:normal;font-size:22px}.tool strong{font-size:12px}.tool small{font-size:10px;color:#a9b8ca}.options{display:flex;gap:7px;margin-top:9px}.options .btn{flex:1;font-size:12px}.hint{margin:9px 2px 0;color:#9aabc0;font-size:11px}.right{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}.right .btn{background:#101c2bdb}.toast{position:fixed;top:48%;left:50%;transform:translate(-50%,-50%) scale(.8);font-size:clamp(28px,6vw,64px);font-weight:1000;font-style:italic;color:#ffdf8b;text-shadow:0 4px 0 #6c281b,0 0 35px #ff6a2a;opacity:0;pointer-events:none;white-space:nowrap}.toast.show{animation:pop 1s ease-out}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}.cross{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;opacity:.5}.cross:before,.cross:after{content:'';position:absolute;background:#fff}.cross:before{left:8px;top:0;width:2px;height:18px}.cross:after{top:8px;left:0;height:2px;width:18px}.foot{position:fixed;right:16px;top:95px;color:#d6e2f1aa;font-size:11px;text-align:right;pointer-events:none}@media(max-width:650px){.top{top:8px;left:8px;right:8px}.brand{padding:8px 10px}.stats{padding:7px 9px}.switcher{top:83px;left:8px}.panel{left:8px;bottom:8px;padding:8px;width:min(340px,calc(100vw - 16px))}.tool{min-height:58px}.tools{gap:5px}.right{right:8px;bottom:205px}.right .btn{padding:7px 9px;font-size:11px}.foot{display:none}}
</style></head><body><div id="stage"></div>
<div class="top"><div class="brand"><small>DESTRUCTION SANDBOX / 3D</small><h1>SMASH WORLD</h1></div><div class="stats"><span>DESTRUCTION SCORE</span><b id="score">000000</b><span id="count">붕괴한 건물 0개</span></div></div>
<div class="switcher"><button class="btn active" data-world="school">🏫 일반 학교</button><button class="btn" data-world="city">🏙️ 일반 도시</button></div>
<div class="foot">드래그: 시점 회전 · 우클릭 드래그: 이동 · 휠: 확대</div><div class="cross"></div><div class="toast" id="toast">SMASH!</div>
<div class="panel"><h3>DESTRUCTION TOOLS · 1—6</h3><div class="tools">
<button class="btn tool active" data-tool="bomb"><i>💣</i><strong>폭탄</strong><small>넓은 범위 폭발</small></button>
<button class="btn tool" data-tool="bat"><i>🏏</i><strong>야구 배트</strong><small>날려 보내기</small></button>
<button class="btn tool" data-tool="laser"><i>⚡</i><strong>레이저</strong><small>드래그해 발사</small></button>
<button class="btn tool" data-tool="meteor"><i>☄️</i><strong>운석</strong><small>낙하 충돌</small></button>
<button class="btn tool" data-tool="quake"><i>🌋</i><strong>지진</strong><small>주변 전체 흔들기</small></button>
<button class="btn tool" data-tool="nuke"><i>☢️</i><strong>핵폭탄</strong><small>초대형 폭발</small></button>
</div><div class="options"><button class="btn" id="undo">↶ 되돌리기</button><button class="btn" id="reset">⟲ 전부 복구</button><button class="btn" id="sound">🔊 소리 켬</button></div><p class="hint" id="hint">건물을 클릭해 폭탄을 설치하세요. 파괴된 파편도 다시 타격할 수 있어요.</p></div>
<div class="right"><button class="btn" id="night">🌙 낮 / 밤</button><button class="btn" id="home">⌖ 전체 보기</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const stage=document.querySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc2df);scene.fog=new THREE.Fog(0x9bc2df,65,170);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,500);camera.position.set(38,34,48);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;stage.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,5,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=12;controls.maxDistance=115;
scene.add(new THREE.HemisphereLight(0xe5f4ff,0x526044,2));const sun=new THREE.DirectionalLight(0xffedcf,3);sun.position.set(-35,65,30);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const groundMat=new THREE.MeshStandardMaterial({color:0x66865c,roughness:1}),ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),groundMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(220,44,0x617c5d,0x78906d);grid.position.y=.02;scene.add(grid);
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let buildings=[],debris=[],effects=[],history=[],score=0,destroyed=0,tool='bomb',world='school',night=false,soundOn=true,dragStart=null,laserLine=null,quakeUntil=0;
const mat=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const mats={wall:mat(0xd6d4c9),roof:mat(0x697581),glass:mat(0x46788a,.25,.25),brick:mat(0x9a624c),road:mat(0x343b43),green:mat(0x577b4d),yellow:mat(0xd9b96e)};
const boxGeo=new THREE.BoxGeometry(1,1,1);
function sound(type='hit',power=1){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;const c=sound.ctx||(sound.ctx=new C());if(c.state==='suspended')c.resume();const t=c.currentTime,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.connect(f);f.connect(g);g.connect(c.destination);if(type==='boom'){o.type='sawtooth';o.frequency.setValueAtTime(100+power*20,t);o.frequency.exponentialRampToValueAtTime(25,t+.55);f.type='lowpass';f.frequency.setValueAtTime(500,t);g.gain.setValueAtTime(.42,t);g.gain.exponentialRampToValueAtTime(.001,t+.65);o.start(t);o.stop(t+.66)}else if(type==='laser'){o.type='square';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(90,t+.4);g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.42);o.start(t);o.stop(t+.43)}else{o.type='triangle';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(45,t+.18);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.21)}}catch(e){}}
function building(x,z,w,h,d,kind='block',name='건물'){const group=new THREE.Group();group.position.set(x,0,z);const base=kind==='school'?mats.wall:kind==='tower'?mats.glass:mats.brick;const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),base);body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;group.add(body);const roof=new THREE.Mesh(new THREE.BoxGeometry(w*1.04,.45,d*1.04),mats.roof);roof.position.y=h+.2;roof.castShadow=true;group.add(roof);
const floors=Math.max(2,Math.floor(h/3));for(let y=1.5;y<h-.8;y+=Math.max(2.2,h/floors)){for(let side of [-1,1]){const win=new THREE.Mesh(new THREE.BoxGeometry(w*.72,.85,.08),mats.glass);win.position.set(0,y,side*(d/2+.045));group.add(win);const win2=win.clone();win2.position.set(side*(w/2+.045),y,0);win2.rotation.y=Math.PI/2;group.add(win2)}}
const sign=new THREE.Mesh(new THREE.BoxGeometry(w*.5,.7,.08),mats.yellow);sign.position.set(0,Math.min(h-1,3),d/2+.09);group.add(sign);scene.add(group);group.userData={w,h,d,name,kind,alive:true};buildings.push(group);return group}
function tree(x,z){const g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,2,7),mat(0x74503a));tr.position.y=1;g.add(tr);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.4,1),mat(0x477a45));crown.position.y=2.5;crown.castShadow=true;g.add(crown);g.position.set(x,0,z);scene.add(g)}
function clearWorld(){for(const b of buildings)scene.remove(b);for(const d of debris)scene.remove(d.mesh);for(const e of effects)scene.remove(e.mesh);buildings=[];debris=[];effects=[];history=[];destroyed=0;score=0;updateHUD()}
function makeWorld(type){clearWorld();world=type;const city=type==='city';groundMat.color.set(city?0x777b78:0x66865c);scene.background.set(city?0x8da3b8:0x9bc2df);scene.fog.color.copy(scene.background);grid.visible=!city;
if(city){for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){if(i===0&&j===0)continue;const h=8+Math.random()*24;building(i*12,j*12,7+Math.random()*2,h,7+Math.random()*2,'tower',['오피스','상가','아파트','호텔'][Math.floor(Math.random()*4)])}for(let i=-4;i<=4;i++){const road=new THREE.Mesh(new THREE.BoxGeometry(220,.04,3),mats.road);road.position.set(0,.03,i*12);scene.add(road);effects.push({mesh:road,static:true})}}
else{building(-14,-8,19,10,13,'school','본관');building(10,-9,13,16,12,'school','과학관');building(-13,13,12,7,10,'school','체육관');building(10,13,12,12,10,'school','도서관');building(0,0,8,5,8,'school','급식실');for(let i=0;i<12;i++)tree(-29+i*5,23+(i%2)*3);const court=new THREE.Mesh(new THREE.BoxGeometry(22,.08,13),mat(0x4d6f9a));court.position.set(0,.06,30);scene.add(court);effects.push({mesh:court,static:true})}
for(let i=0;i<10;i++)tree((Math.random()-.5)*85,(Math.random()-.5)*80);controls.target.set(0,5,0);camera.position.set(38,34,48);controls.update();document.querySelectorAll('[data-world]').forEach(b=>b.classList.toggle('active',b.dataset.world===type));}
function updateHUD(){document.querySelector('#score').textContent=String(score).padStart(6,'0');document.querySelector('#count').textContent='붕괴한 건물 '+destroyed+'개'}
function pop(text){const el=document.querySelector('#toast');el.textContent=text;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function snapshot(){history.push(buildings.map(b=>({b,visible:b.visible,alive:b.userData.alive})));if(history.length>12)history.shift()}
function burst(pos,power=1,radius=12){sound('boom',power);const flash=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:0xffb34d,transparent:true,opacity:.8}));flash.position.copy(pos);scene.add(flash);effects.push({mesh:flash,life:.5,max:.5,scale:radius});for(const b of buildings){if(!b.visible)continue;const p=b.position.clone().add(new THREE.Vector3(0,b.userData.h/2,0));const dist=p.distanceTo(pos);if(dist<radius){const strength=1-dist/radius;damage(b,Math.ceil(power*strength*100),pos,strength)}}}
function damage(b,points,origin,strength=1){if(!b.visible)return;const u=b.userData;const chunks=Math.min(14,Math.max(3,Math.floor(points/14)));for(let i=0;i<chunks;i++){const size=.6+Math.random()*1.5;const m=new THREE.Mesh(boxGeo,[mats.wall,mats.brick,mats.roof,mats.glass][i%4]);m.scale.set(size,size*(.7+Math.random()),size);m.position.set(b.position.x+(Math.random()-.5)*u.w,b.position.y+Math.random()*u.h,b.position.z+(Math.random()-.5)*u.d);m.castShadow=true;scene.add(m);const dir=m.position.clone().sub(origin).normalize();dir.y=Math.abs(dir.y)+.35;debris.push({mesh:m,v:dir.multiplyScalar(7+strength*15+Math.random()*8),spin:new THREE.Vector3(Math.random(),Math.random(),Math.random()).multiplyScalar(7),life:8})}
if(points>35||strength>.8){b.visible=false;u.alive=false;destroyed++;score+=Math.round(100+points*2);pop(u.name+' DESTROYED!')}else{score+=Math.round(points*2);b.scale.y=Math.max(.35,b.scale.y-.12);b.position.y=0}updateHUD()}
function pick(ev){const r=renderer.domElement.getBoundingClientRect();mouse.x=(ev.clientX-r.left)/r.width*2-1;mouse.y=-(ev.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);const targets=[...buildings.filter(b=>b.visible),...debris.map(d=>d.mesh),ground];const hit=ray.intersectObjects(targets,true)[0];return hit||null}
function strike(hit){if(!hit)return;const p=hit.point.clone();if(hit.object===ground||hit.object.parent===scene){if(tool==='bomb')burst(p,1.4,11);else if(tool==='meteor')meteor(p);else if(tool==='quake')quake(p);else if(tool==='nuke')nuke(p);else if(tool==='laser')laser(p,p.clone().add(new THREE.Vector3(10,0,0)));return}
let b=hit.object;while(b&&!b.userData?.alive)b=b.parent;if(!b||!b.userData?.alive){const d=debris.find(x=>x.mesh===hit.object);if(d){d.v.add(new THREE.Vector3(0,10,0));score+=15;updateHUD()}return}
snapshot();if(tool==='bomb')burst(p,1.7,13);if(tool==='bat'){sound('hit');const dir=p.clone().sub(camera.position).normalize();damage(b,80,p,1.2);for(const d of debris)if(d.mesh.position.distanceTo(p)<14)d.v.add(dir.clone().multiplyScalar(30));score+=40;updateHUD()}if(tool==='laser){sound('laser');damage(b,90,p,1.1)}if(tool==='meteor')meteor(p);if(tool==='quake')quake(p);if(tool==='nuke')nuke(p)}
function meteor(p){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(2.1,1),mat(0xff642e,.5));m.position.copy(p).add(new THREE.Vector3(0,35,0));scene.add(m);effects.push({mesh:m,life:1.1,max:1.1,meteor:true,target:p.clone()});sound('hit')}
function quake(p){quakeUntil=performance.now()+2600;sound('boom',2);for(const b of buildings)if(b.visible&&b.position.distanceTo(p)<34){snapshot();damage(b,50+Math.random()*45,p,.75)}pop('EARTHQUAKE!')}
function nuke(p){pop('NUCLEAR IMPACT');setTimeout(()=>burst(p,8,42),650);const ring=new THREE.Mesh(new THREE.TorusGeometry(1,.16,8,48),new THREE.MeshBasicMaterial({color:0xffe4a0,transparent:true}));ring.rotation.x=Math.PI/2;ring.position.copy(p).add(new THREE.Vector3(0,.3,0));scene.add(ring);effects.push({mesh:ring,life:2,max:2,ring:true});sound('boom',8)}
function laser(a,b){sound('laser');const geo=new THREE.BufferGeometry().setFromPoints([a.clone().add(new THREE.Vector3(0,1,0)),b.clone().add(new THREE.Vector3(0,1,0))]);const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x6ff7ff,linewidth:4}));scene.add(line);effects.push({mesh:line,life:.35,max:.35});const mid=a.clone().lerp(b,.5);for(const obj of buildings){if(!obj.visible)continue;const q=obj.position.clone().add(new THREE.Vector3(0,obj.userData.h/2,0));const ab=b.clone().sub(a),t=THREE.MathUtils.clamp(q.clone().sub(a).dot(ab)/ab.lengthSq(),0,1);if(q.distanceTo(a.clone().add(ab.multiplyScalar(t)))<5){snapshot();damage(obj,100,mid,1.2)}}}
renderer.domElement.addEventListener('pointerdown',e=>{if(e.button===2){dragStart=null;return}dragStart={x:e.clientX,y:e.clientY,hit:pick(e)}});
renderer.domElement.addEventListener('pointerup',e=>{if(e.button!==0||!dragStart)return;const start=dragStart;dragStart=null;const moved=Math.hypot(e.clientX-start.x,e.clientY-start.y);if(tool==='laser'&&moved>12){const a=start.hit?.point||new THREE.Vector3(0,0,0),h=pick(e),b=h?.point||a.clone().add(new THREE.Vector3(15,0,0));laser(a,b)}else if(moved<10)strike(start.hit)});
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('[data-tool]').forEach((b,i)=>b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#hint').textContent=tool==='laser'?'화면을 드래그해 레이저를 그으세요.':tool==='bat'?'건물을 클릭해 거대한 배트로 날려 보내세요.':'건물 또는 땅을 클릭해 '+b.querySelector('strong').textContent+'을(를) 사용하세요.'}));
document.querySelectorAll('[data-world]').forEach(b=>b.addEventListener('click',()=>makeWorld(b.dataset.world)));
document.querySelector('#undo').onclick=()=>{const s=history.pop();if(!s)return;for(const x of s){x.b.visible=x.visible;x.b.userData.alive=x.alive}pop('UNDO');score=Math.max(0,score-50);updateHUD()};
document.querySelector('#reset').onclick=()=>makeWorld(world);
document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 소리 켬':'🔇 소리 끔'};
document.querySelector('#night').onclick=()=>{night=!night;scene.background.set(night?0x080e20:(world==='city'?0x8da3b8:0x9bc2df));scene.fog.color.copy(scene.background);sun.intensity=night?.35:3;pop(night?'NIGHT MODE':'DAY MODE')};
document.querySelector('#home').onclick=()=>{controls.target.set(0,5,0);camera.position.set(38,34,48);controls.update()};
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='6')document.querySelectorAll('[data-tool]')[Number(e.key)-1].click();if(e.key.toLowerCase()==='n')document.querySelector('#night').click();if(e.key==='Escape')document.querySelector('#home').click()});
function animate(){requestAnimationFrame(animate);const dt=Math.min(.04,clock.getDelta()),now=performance.now();controls.update();if(now<quakeUntil){camera.position.x+=Math.sin(now*.05)*.12;camera.position.y+=Math.cos(now*.07)*.1}
for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.life-=dt;d.v.y-=20*dt;d.mesh.position.addScaledVector(d.v,dt);d.mesh.rotation.x+=d.spin.x*dt;d.mesh.rotation.y+=d.spin.y*dt;if(d.mesh.position.y<.3){d.mesh.position.y=.3;d.v.y=Math.abs(d.v.y)*.28;d.v.multiplyScalar(.76)}if(d.life<0){scene.remove(d.mesh);debris.splice(i,1)}}
for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life-=dt;if(e.meteor){e.mesh.position.lerp(e.target,Math.min(1,dt*4));e.mesh.rotation.x+=dt*5;if(e.life<=0){burst(e.target,3,19);scene.remove(e.mesh);effects.splice(i,1);continue}}else if(e.ring){e.mesh.scale.setScalar(1+(2-e.life)*17);e.mesh.material.opacity=Math.max(0,e.life/2)}else if(e.scale){const k=1-e.life/e.max;e.mesh.scale.setScalar(.5+k*e.scale);e.mesh.material.opacity=e.life/e.max}if(e.life<=0){scene.remove(e.mesh);effects.splice(i,1)}}
renderer.render(scene,camera)}
const clock=new THREE.Clock();makeWorld('school');animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
